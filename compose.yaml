services:
  recipe-import:
    profiles: [import]
    build: { context: ., dockerfile: recipe-import/Dockerfile }
    command: [/input/recipes.csv, /data/recipes.sqlite, --expected-rows, '39447']
    volumes: ['${RECIPE_DATASET_CSV:-./data/recipes-with-nutrition.csv}:/input/recipes.csv:ro', 'recipe-data:/data']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
  nutrition-import:
    profiles: [import]
    build: { context: ., dockerfile: nutrition-import/Dockerfile }
    command: [/input, /data/nutrition.sqlite]
    volumes: ['${USDA_DATA_DIR:-./data/usda}:/input:ro', 'nutrition-data:/data']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
  api:
    build: { context: ., dockerfile: server/Dockerfile }
    environment: { APP_EDITION: '${APP_EDITION:-core}', RECIPE_DB_PATH: /data/recipes/recipes.sqlite, NUTRITION_DB_PATH: /data/nutrition/nutrition.sqlite }
    volumes: ['recipe-data:/data/recipes:ro', 'nutrition-data:/data/nutrition:ro']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    restart: unless-stopped
  web:
    build:
      context: .
      args: { APP_EDITION: '${APP_EDITION:-core}', VITE_FIREBASE_API_KEY: '${VITE_FIREBASE_API_KEY:-}', VITE_FIREBASE_AUTH_DOMAIN: '${VITE_FIREBASE_AUTH_DOMAIN:-}', VITE_FIREBASE_PROJECT_ID: '${VITE_FIREBASE_PROJECT_ID:-}', VITE_FIREBASE_APP_ID: '${VITE_FIREBASE_APP_ID:-}', VITE_FIREBASE_MEASUREMENT_ID: '${VITE_FIREBASE_MEASUREMENT_ID:-}' }
    depends_on: [api]
    ports: ['${HTTP_BIND_IP:-0.0.0.0}:${HTTP_PORT:-8080}:80']
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    restart: unless-stopped
volumes: { recipe-data: {}, nutrition-data: {} }

