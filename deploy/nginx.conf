limit_req_zone $binary_remote_addr zone=eatfit_ai:10m rate=12r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location = /manifest.webmanifest { default_type application/manifest+json; expires -1; try_files $uri =404; }
  location = /sw.js { default_type application/javascript; expires -1; try_files $uri =404; }
  location = /api/ai/movement/prepare { limit_req zone=eatfit_ai burst=20 nodelay; proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 5s; proxy_read_timeout 180s; proxy_send_timeout 180s; client_max_body_size 32m; }
  location /api/ai/meta/ { limit_req zone=eatfit_ai burst=20 nodelay; proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 5s; proxy_read_timeout 190s; proxy_send_timeout 190s; client_max_body_size 32m; }
  location = /api/ai/recipes/image { limit_req zone=eatfit_ai burst=20 nodelay; proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 5s; proxy_read_timeout 120s; proxy_send_timeout 120s; client_max_body_size 256k; }
  location /api/ai/ { limit_req zone=eatfit_ai burst=20 nodelay; proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 5s; proxy_read_timeout 190s; client_max_body_size 2m; }
  location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_connect_timeout 5s; proxy_read_timeout 60s; client_max_body_size 2m; }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy 'camera=(self)' always;
}

